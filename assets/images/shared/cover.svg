<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="800" height="1200">
  <defs>
    <radialGradient id="vignette" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EBE3D3" />
    </radialGradient>
    <filter id="subtle-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="1200" fill="url(#vignette)" />

  <!-- Outer frame border -->
  <rect x="40" y="40" width="720" height="1120" fill="none" stroke="#C4572A" stroke-width="1.5" stroke-opacity="0.35" />
  <rect x="48" y="48" width="704" height="1104" fill="none" stroke="#1E160A" stroke-width="0.75" stroke-opacity="0.18" />

  <!-- Geometric Architectural Emblem -->
  <g transform="translate(400, 380)" stroke="#C4572A" fill="none" stroke-width="1.5" stroke-opacity="0.8">
    <circle r="120" stroke-dasharray="3 3" />
    <circle r="80" />
    <polygon points="0,-80 69.28,40 -69.28,40" stroke-opacity="0.6" />
    <polygon points="0,80 69.28,-40 -69.28,-40" stroke-opacity="0.6" />
    <circle r="6" fill="#C4572A" />
  </g>

  <!-- Title & Typography -->
  <text x="400" y="600" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#1E160A" letter-spacing="1">
    THE ARCHITECTURE
  </text>
  <text x="400" y="650" text-anchor="middle" font-family="'Playfair Display', Georgia, serif" font-size="44" font-weight="700" fill="#1E160A" letter-spacing="1">
    OF THOUGHT
  </text>

  <!-- Divider -->
  <line x1="340" y1="690" x2="460" y2="690" stroke="#C4572A" stroke-width="2" />
  <text x="400" y="694" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="14" fill="#C4572A">⁂</text>

  <!-- Subtitle -->
  <text x="400" y="740" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="18" font-style="italic" fill="#6B5438">
    An Inquiry into Perception, Memory, Cognition,
  </text>
  <text x="400" y="770" text-anchor="middle" font-family="'Lora', Georgia, serif" font-size="18" font-style="italic" fill="#6B5438">
    and the Stories We Tell Ourselves
  </text>

  <!-- Author -->
  <text x="400" y="980" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="14" font-weight="600" fill="#9C7E5C" letter-spacing="3">
    ARINDAM
  </text>

  <!-- Footer Edition -->
  <text x="400" y="1020" text-anchor="middle" font-family="'Inter', -apple-system, sans-serif" font-size="11" font-weight="500" fill="#A08060" letter-spacing="1.5">
    FOLIO EDITION · 2025
  </text>
</svg>
